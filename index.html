<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatoire Taxonomique & Cladistique</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style
    :root {
      --bg-space: #07090e;
      --panel-bg: rgba(13, 17, 24, 0.96);
      --card-bg: #111822;
      --card-hover: #1b2636;
      --border: #1f2937;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-space);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Barre supérieure */
    header {
      background: #0b0f17;
      border-bottom: 1px solid var(--border);
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 100;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
    }

    .brand-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent-cyan);
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .metrics-bar {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .metric-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .metric-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    /* Barre de raccourcis visuels */
    .quick-bar {
      background: #0a0e16;
      border-bottom: 1px solid var(--border);
      padding: 0.4rem 1rem;
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      align-items: center;
      flex-shrink: 0;
    }

    .quick-tag {
      background: #111823;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.3rem 0.65rem;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }

    .quick-tag:hover, .quick-tag.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-cyan);
      color: #fff;
    }

    /* Corps de l'application */
    .cockpit-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Volet gauche */
    aside.sidebar-left {
      width: 320px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 20;
    }

    .sidebar-header {
      padding: 0.85rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .search-box input {
      width: 100%;
      background: #090d14;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.45rem 0.65rem;
      color: var(--text-main);
      font-size: 0.825rem;
      outline: none;
    }

    .taxo-tree {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 0.5rem;
      font-size: 0.8rem;
    }

    .tree-node { margin-bottom: 0.25rem; }

    .tree-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
    }

    .tree-label:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-main); }
    .tree-label.selected { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); font-weight: 600; }

    .tree-count {
      font-size: 0.7rem;
      background: #0a0e17;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      color: var(--text-dim);
    }

    .tree-children {
      margin-left: 0.85rem;
      border-left: 1px dashed var(--border);
      padding-left: 0.4rem;
      display: none;
    }

    .tree-children.expanded { display: block; }

    /* Zone centrale */
    main.viewport-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #080b11;
      position: relative;
    }

    .subbar {
      height: 44px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      font-size: 0.8rem;
      background: #0b1018;
      z-index: 10;
    }

    .view-modes {
      display: flex;
      background: #06090e;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 500;
    }

    .view-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
    }

    .views-stack {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .view-pane {
      position: absolute;
      inset: 0;
      display: none;
    }

    .view-pane.active { display: flex; flex-direction: column; }

    /* Diagramme Sunburst */
    #sunburstContainer {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .sunburst-nav-hint {
      position: absolute;
      top: 1rem;
      left: 1rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      background: rgba(11, 16, 24, 0.8);
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      pointer-events: none;
    }

    .sunburst-tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(11, 16, 24, 0.95);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #fff;
      display: none;
      z-index: 50;
    }

    /* Mosaïque */
    .grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      grid-auto-rows: 230px;
      gap: 1rem;
    }

    .specimen-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }

    .specimen-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-cyan);
      background: var(--card-hover);
    }

    .card-thumb {
      flex: 1;
      background: #05070a;
      overflow: hidden;
      position: relative;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .drive-indicator {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(16, 185, 129, 0.85);
      color: #032214;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
    }

    .card-info {
      padding: 0.55rem;
      background: #0e141e;
      border-top: 1px solid var(--border);
    }

    .card-sci {
      font-size: 0.775rem;
      font-weight: 600;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .card-vern {
      font-size: 0.7rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Carte globale */
    #globalSatelliteMap { width: 100%; height: 100%; }

    /* Popups personnalisés sur la carte */
    .leaflet-popup-content-wrapper {
      background: #0d121c !important;
      color: #fff !important;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0;
      overflow: hidden;
    }
    .leaflet-popup-content { margin: 0 !important; width: 220px !important; }
    .map-popup-thumb { width: 100%; height: 120px; object-fit: cover; display: block; }
    .map-popup-body { padding: 0.6rem; }
    .map-popup-title { font-style: italic; font-weight: 600; font-size: 0.8rem; margin-bottom: 0.2rem; }
    .map-popup-vern { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.4rem; }
    .map-popup-btn {
      width: 100%;
      background: var(--accent-cyan);
      color: #042436;
      border: none;
      padding: 0.35rem 0;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Volet droit d'expertise : z-index 2000 pour couvrir la carte */
    aside.sidebar-right {
      width: 440px;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      z-index: 2000;
      backdrop-filter: blur(16px);
      box-shadow: -10px 0 30px rgba(0,0,0,0.8);
    }

    aside.sidebar-right.open { transform: translateX(0); }

    .right-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }
    .close-btn:hover { color: #fff; }

    .right-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .hero-view {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: #000;
      border: 1px solid var(--border);
    }
    .hero-view img { width: 100%; height: 100%; object-fit: cover; }

    .taxonomy-ladder {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      background: #090d15;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .ladder-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      padding: 0.15rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .ladder-rank { color: var(--text-dim); text-transform: uppercase; font-size: 0.65rem; }
    .ladder-name { font-weight: 500; color: var(--accent-cyan); }

    .btn-action {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 0.85rem;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-action:hover { background: #283548; }
    .btn-action.primary {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--accent-green);
    }

    #specimenMap {
      height: 200px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-title">Taxa Laboratory</div>
      <div class="brand-badge">Cladistique v2.2</div>
    </div>
    <div class="metrics-bar">
      <div class="metric-item">
        <span class="metric-label">Espèces validées</span>
        <span class="metric-value" id="topSpeciesCount">—</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Dossiers Drive</span>
        <span class="metric-value" id="topDriveCount" style="color: var(--accent-green);">—</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Échantillons affichés</span>
        <span class="metric-value" id="topFilteredCount" style="color: var(--accent-amber);">—</span>
      </div>
    </div>
  </header>

  <!-- Raccourcis visuels grand public -->
  <div class="quick-bar">
    <span style="font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim); margin-right: 0.25rem;">Groupes clés :</span>
    <button class="quick-tag" onclick="quickFilter('Lepidoptera', 'order')">🦋 Papillons</button>
    <button class="quick-tag" onclick="quickFilter('Coleoptera', 'order')">🪲 Coléoptères</button>
    <button class="quick-tag" onclick="quickFilter('Araneae', 'order')">🕷️ Araignées</button>
    <button class="quick-tag" onclick="quickFilter('Odonata', 'order')">🪰 Libellules</button>
    <button class="quick-tag" onclick="quickFilter('Aves', 'class')">🦅 Oiseaux</button>
    <button class="quick-tag" onclick="quickFilter('Plantae', 'kingdom')">🌿 Flore</button>
    <button class="quick-tag" onclick="quickFilter('Fungi', 'kingdom')">🍄 Champignons</button>
    <button class="quick-tag" onclick="quickFilter('Reptilia', 'class')">🦎 Reptiles</button>
  </div>

  <div class="cockpit-body">

    <!-- Volet gauche -->
    <aside class="sidebar-left">
      <div class="sidebar-header">
        <div class="search-box">
          <input type="text" id="globalSearch" placeholder="Rechercher par binôme latin, nom vernaculaire..." />
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button id="resetFilterBtn" class="btn-action" style="flex: 1; padding: 0.35rem 0.5rem; font-size: 0.75rem;">Réinitialiser</button>
          <button id="onlyDriveBtn" class="btn-action primary" style="flex: 1; padding: 0.35rem 0.5rem; font-size: 0.75rem;">Dossiers Drive</button>
        </div>
      </div>
      <div class="taxo-tree" id="taxoTree"></div>
    </aside>

    <!-- Zone centrale polyvalente -->
    <main class="viewport-center">
      <div class="subbar">
        <div class="view-modes">
          <button class="view-btn active" onclick="switchView('grid')">Planches spécimens</button>
          <button class="view-btn" onclick="switchView('sunburst')">Arbre radial</button>
          <button class="view-btn" onclick="switchView('map')">Carte satellite</button>
        </div>

        <div id="filterStatus" style="color: var(--text-muted); font-size: 0.75rem;">Collection complète</div>

        <div id="gridPagination" style="display: flex; gap: 0.5rem; align-items: center;">
          <span id="pageInfo" style="color: var(--text-dim); font-size: 0.75rem;"></span>
          <button id="prevBtn" class="btn-action" style="padding: 0.2rem 0.5rem;">&lt;</button>
          <button id="nextBtn" class="btn-action" style="padding: 0.2rem 0.5rem;">&gt;</button>
        </div>
      </div>

      <div class="views-stack">
        <!-- 1. Mosaïque active par défaut (plus de page vide) -->
        <div class="view-pane active" id="viewGrid">
          <div class="grid-container" id="matrixGrid"></div>
        </div>

        <!-- 2. Arbre Radial Sunburst -->
        <div class="view-pane" id="viewSunburst">
          <div id="sunburstContainer">
            <div class="sunburst-nav-hint">Cliquez sur un secteur pour zoomer et filtrer les fiches. Cliquez au centre pour dézoomer.</div>
            <div class="sunburst-tooltip" id="sunburstTooltip"></div>
          </div>
        </div>

        <!-- 3. Carte Globale -->
        <div class="view-pane" id="viewMap">
          <div id="globalSatelliteMap"></div>
        </div>
      </div>
    </main>

    <!-- Volet droit d'expertise -->
    <aside class="sidebar-right" id="expertPanel">
      <div class="right-header">
        <div>
          <h2 id="detailSciName" style="font-style: italic; font-size: 1.15rem; color: #fff;"></h2>
          <p id="detailVernName" style="font-size: 0.8rem; color: var(--text-muted);"></p>
        </div>
        <button class="close-btn" onclick="closeExpertPanel()">&times;</button>
      </div>

      <div class="right-content">
        <div class="hero-view">
          <img id="detailImg" src="" alt="Spécimen" />
          <span id="detailDriveTag" class="drive-indicator" style="display: none;">Dossier Drive lié</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <a id="detailDriveLink" href="#" target="_blank" class="btn-action primary" style="display: none;">
            Ouvrir le dossier Google Drive
          </a>
          <button id="btnIsolateFamily" class="btn-action">
            Isoler tous les membres de cette famille
          </button>
        </div>

        <div class="taxonomy-ladder" id="detailLadder"></div>

        <div>
          <div style="font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.4rem; letter-spacing: 0.05em;">
            Coordonnées du relevé
          </div>
          <div id="specimenMap"></div>
          <div id="detailLocText" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem;"></div>
        </div>
      </div>
    </aside>

  </div>

  <script>
    let rawSpecies = [];
    let currentFilter = { query: '', rank: null, value: null, driveOnly: false };
    let filteredList = [];
    let page = 1;
    const PAGE_SIZE = 60;
    let detailMap = null;
    let detailMarker = null;
    let globalMap = null;
    let markersLayer = null;

    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        rawSpecies = data;
        filteredList = data;
        document.getElementById('topSpeciesCount').innerText = rawSpecies.length.toLocaleString('fr-FR');
        const driveCount = rawSpecies.filter(s => s.drive_folder_id).length;
        document.getElementById('topDriveCount').innerText = `${driveCount.toLocaleString('fr-FR')} (${Math.round(driveCount / rawSpecies.length * 100)}%)`;

        buildTaxonomyTree();
        applyFilter();
        buildSunburst();
      })
      .catch(err => {
        console.error(err);
        document.getElementById('filterStatus').innerText = 'Erreur lors de la lecture de data.json';
      });

    function quickFilter(value, rank) {
      document.querySelectorAll('.quick-tag').forEach(t => t.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.quick-tag')).find(b => b.innerText.includes(value));
      if (activeBtn) activeBtn.classList.add('active');

      setFilter(rank, value);
      switchView('grid');
    }

    function switchView(mode) {
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));

      if (mode === 'grid') {
        document.querySelectorAll('.view-btn')[0].classList.add('active');
        document.getElementById('viewGrid').classList.add('active');
        document.getElementById('gridPagination').style.display = 'flex';
        renderGrid();
      } else if (mode === 'sunburst') {
        document.querySelectorAll('.view-btn')[1].classList.add('active');
        document.getElementById('viewSunburst').classList.add('active');
        document.getElementById('gridPagination').style.display = 'none';
      } else if (mode === 'map') {
        document.querySelectorAll('.view-btn')[2].classList.add('active');
        document.getElementById('viewMap').classList.add('active');
        document.getElementById('gridPagination').style.display = 'none';
        initGlobalMap();
      }
    }

    function buildSunburst() {
      const container = document.getElementById('sunburstContainer');
      const width = Math.min(container.clientWidth || 600, container.clientHeight || 600, 720);
      const radius = width / 6;

      const hierarchyData = { name: "Biota", children: [] };
      const mapTree = {};

      rawSpecies.forEach(sp => {
        const k = sp.taxonomy.kingdom || 'Incertain';
        const p = sp.taxonomy.phylum || 'Autre';
        const o = sp.taxonomy.order || 'Ordre indét.';

        if (!mapTree[k]) mapTree[k] = {};
        if (!mapTree[k][p]) mapTree[k][p] = {};
        mapTree[k][p][o] = (mapTree[k][p][o] || 0) + 1;
      });

      for (const k in mapTree) {
        const kNode = { name: k, rank: 'kingdom', children: [] };
        for (const p in mapTree[k]) {
          const pNode = { name: p, rank: 'phylum', children: [] };
          for (const o in mapTree[k][p]) {
            pNode.children.push({ name: o, rank: 'order', value: mapTree[k][p][o] });
          }
          kNode.children.push(pNode);
        }
        hierarchyData.children.push(kNode);
      }

      const color = d3.scaleOrdinal(d3.quantize(d3.interpolateRainbow, hierarchyData.children.length + 1));
      const hierarchy = d3.hierarchy(hierarchyData)
        .sum(d => d.value)
        .sort((a, b) => b.value - a.value);

      const root = d3.partition().size([2 * Math.PI, hierarchy.height + 1])(hierarchy);
      root.each(d => d.current = d);

      const arc = d3.arc()
        .startAngle(d => d.x0)
        .endAngle(d => d.x1)
        .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
        .padRadius(radius * 1.5)
        .innerRadius(d => d.y0 * radius)
        .outerRadius(d => Math.max(d.y0 * radius, d.y1 * radius - 1));

      d3.select("#sunburstContainer svg").remove();
      const svg = d3.select("#sunburstContainer")
        .append("svg")
        .attr("viewBox", [-width / 2, -width / 2, width, width])
        .style("font", "10px sans-serif");

      const path = svg.append("g")
        .selectAll("path")
        .data(root.descendants().slice(1))
        .join("path")
        .attr("fill", d => { while (d.depth > 1) d = d.parent; return color(d.data.name); })
        .attr("fill-opacity", d => arcVisible(d.current) ? (d.children ? 0.8 : 0.5) : 0)
        .attr("pointer-events", d => arcVisible(d.current) ? "auto" : "none")
        .attr("d", d => arc(d.current));

      const tooltip = document.getElementById('sunburstTooltip');

      path.style("cursor", "pointer")
        .on("mouseenter", (event, d) => {
          tooltip.style.display = 'block';
          tooltip.innerHTML = `<strong>${d.data.name}</strong><br>${d.value} espèces`;
        })
        .on("mousemove", (event) => {
          tooltip.style.left = (event.clientX + 14) + 'px';
          tooltip.style.top = (event.clientY + 14) + 'px';
        })
        .on("mouseleave", () => { tooltip.style.display = 'none'; })
        .on("click", clicked);

      const parent = svg.append("circle")
        .datum(root)
        .attr("r", radius)
        .attr("fill", "rgba(255,255,255,0.02)")
        .attr("pointer-events", "all")
        .style("cursor", "pointer")
        .on("click", clicked);

      function clicked(event, p) {
        if (!p.children) {
          // Si c'est une feuille terminale (ex: Ordre des papillons), on filtre et on bascule sur les vignettes !
          if (p.data.rank && p.data.name) {
            setFilter(p.data.rank, p.data.name);
            switchView('grid');
          }
          return;
        }

        parent.datum(p.parent || root);

        if (p.data.rank && p.data.name) {
          setFilter(p.data.rank, p.data.name);
        } else if (p === root) {
          setFilter(null, null);
        }

        root.each(d => d.target = {
          x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
          x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
          y0: Math.max(0, d.y0 - p.depth),
          y1: Math.max(0, d.y1 - p.depth)
        });

        const t = svg.transition().duration(700);

        path.transition(t)
          .tween("data", d => {
            const i = d3.interpolate(d.current, d.target);
            return t => d.current = i(t);
          })
          .filter(function(d) {
            return +this.getAttribute("fill-opacity") || arcVisible(d.target);
          })
          .attr("fill-opacity", d => arcVisible(d.target) ? (d.children ? 0.8 : 0.5) : 0)
          .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none")
          .attrTween("d", d => () => arc(d.current));
      }

      function arcVisible(d) {
        return d.y1 <= 3 && d.y0 >= 1 && d.x1 > d.x0;
      }
    }

    function buildTaxonomyTree() {
      const treeContainer = document.getElementById('taxoTree');
      treeContainer.innerHTML = '';
      const tree = {};

      rawSpecies.forEach(sp => {
        const phylum = sp.taxonomy.phylum || 'Non classé';
        const cls = sp.taxonomy.class || 'Classe indéterminée';
        const ord = sp.taxonomy.order || 'Ordre indéterminé';

        if (!tree[phylum]) tree[phylum] = { count: 0, classes: {} };
        tree[phylum].count++;
        if (!tree[phylum].classes[cls]) tree[phylum].classes[cls] = { count: 0, orders: {} };
        tree[phylum].classes[cls].count++;
        if (!tree[phylum].classes[cls].orders[ord]) tree[phylum].classes[cls].orders[ord] = 0;
        tree[phylum].classes[cls].orders[ord]++;
      });

      Object.keys(tree).sort().forEach(phylum => {
        const phylumNode = createNode(phylum, 'phylum', tree[phylum].count);
        const pChildren = document.createElement('div');
        pChildren.className = 'tree-children';

        Object.keys(tree[phylum].classes).sort().forEach(cls => {
          const clsNode = createNode(cls, 'class', tree[phylum].classes[cls].count);
          const cChildren = document.createElement('div');
          cChildren.className = 'tree-children';

          Object.keys(tree[phylum].classes[cls].orders).sort().forEach(ord => {
            const ordNode = createNode(ord, 'order', tree[phylum].classes[cls].orders[ord]);
            cChildren.appendChild(ordNode);
          });

          clsNode.appendChild(cChildren);
          pChildren.appendChild(clsNode);
        });

        phylumNode.appendChild(pChildren);
        treeContainer.appendChild(phylumNode);
      });
    }

    function createNode(title, rank, count) {
      const div = document.createElement('div');
      div.className = 'tree-node';
      const label = document.createElement('div');
      label.className = 'tree-label';
      label.innerHTML = `<span>${title}</span> <span class="tree-count">${count}</span>`;

      label.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.tree-label').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');

        const children = div.querySelector('.tree-children');
        if (children) children.classList.toggle('expanded');
        setFilter(rank, title);
        switchView('grid');
      };

      div.appendChild(label);
      return div;
    }

    function setFilter(rank, value) {
      currentFilter.rank = rank;
      currentFilter.value = value;
      applyFilter();
    }

    function applyFilter() {
      filteredList = rawSpecies.filter(sp => {
        if (currentFilter.query) {
          const q = currentFilter.query.toLowerCase();
          const matchSci = sp.scientific_name.toLowerCase().includes(q);
          const matchVern = sp.common_name && sp.common_name.toLowerCase().includes(q);
          const matchFam = sp.taxonomy.family && sp.taxonomy.family.toLowerCase().includes(q);
          if (!matchSci && !matchVern && !matchFam) return false;
        }

        if (currentFilter.rank && currentFilter.value) {
          if (sp.taxonomy[currentFilter.rank] !== currentFilter.value) return false;
        }

        if (currentFilter.driveOnly && !sp.drive_folder_id) return false;
        return true;
      });

      page = 1;
      updateSubbar();
      renderGrid();
      if (document.getElementById('viewMap').classList.contains('active')) {
        updateMapMarkers();
      }
    }

    function updateSubbar() {
      document.getElementById('topFilteredCount').innerText = filteredList.length.toLocaleString('fr-FR');
      const label = currentFilter.value ? `${currentFilter.rank.toUpperCase()} : ${currentFilter.value}` : 'Collection complète';
      document.getElementById('filterStatus').innerText = `${label} (${filteredList.length} espèces)`;
    }

    function renderGrid() {
      const container = document.getElementById('matrixGrid');
      container.innerHTML = '';

      const start = (page - 1) * PAGE_SIZE;
      const slice = filteredList.slice(start, start + PAGE_SIZE);

      slice.forEach(sp => {
        const card = document.createElement('div');
        card.className = 'specimen-card';
        card.onclick = () => openExpertPanel(sp);

        const thumb = sp.photo_url || 'https://via.placeholder.com/300x220/090d14/475569?text=Absence+de+cliché';
        const driveBadge = sp.drive_folder_id ? `<span class="drive-indicator">DRIVE</span>` : '';

        card.innerHTML = `
          <div class="card-thumb">
            <img src="${thumb}" alt="${sp.scientific_name}" loading="lazy">
            ${driveBadge}
          </div>
          <div class="card-info">
            <div class="card-sci">${sp.scientific_name}</div>
            <div class="card-vern">${sp.common_name || sp.taxonomy.family || 'Taxon valide'}</div>
          </div>
        `;
        container.appendChild(card);
      });

      const totalPages = Math.max(1, Math.ceil(filteredList.length / PAGE_SIZE));
      document.getElementById('pageInfo').innerText = `Page ${page} / ${totalPages}`;
      container.scrollTop = 0;
    }

    function initGlobalMap() {
      setTimeout(() => {
        if (!globalMap) {
          globalMap = L.map('globalSatelliteMap').setView([42.5, 9.3], 5);
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
          }).addTo(globalMap);
          markersLayer = L.layerGroup().addTo(globalMap);
        }
        updateMapMarkers();
        globalMap.invalidateSize();
      }, 100);
    }

    function updateMapMarkers() {
      if (!globalMap || !markersLayer) return;
      markersLayer.clearLayers();

      // On affiche les spécimens géolocalisés
      filteredList.slice(0, 1000).forEach(sp => {
        if (sp.coordinates && sp.coordinates.lat && sp.coordinates.lng) {
          const circle = L.circleMarker([sp.coordinates.lat, sp.coordinates.lng], {
            radius: 5,
            fillColor: '#38bdf8',
            color: '#ffffff',
            weight: 1,
            opacity: 0.9,
            fillOpacity: 0.75
          });

          // Infobulle riche avec vignette photo au clic !
          const popupContent = `
            <img class="map-popup-thumb" src="${sp.photo_url || ''}" alt="">
            <div class="map-popup-body">
              <div class="map-popup-title">${sp.scientific_name}</div>
              <div class="map-popup-vern">${sp.common_name || sp.taxonomy.family || ''}</div>
              <button class="map-popup-btn" onclick='window.triggerSpecimenDetail(${JSON.stringify(sp.id)})'>Examiner la fiche</button>
            </div>
          `;

          circle.bindPopup(popupContent);
          markersLayer.addLayer(circle);
        }
      });
    }

    window.triggerSpecimenDetail = function(id) {
      const sp = rawSpecies.find(s => s.id === id);
      if (sp) openExpertPanel(sp);
    };

    function openExpertPanel(sp) {
      const panel = document.getElementById('expertPanel');
      panel.classList.add('open');

      document.getElementById('detailSciName').innerText = sp.scientific_name;
      document.getElementById('detailVernName').innerText = sp.common_name || 'Nom vernaculaire non renseigné';
      document.getElementById('detailImg').src = sp.photo_url || '';

      const driveLink = document.getElementById('detailDriveLink');
      const driveTag = document.getElementById('detailDriveTag');
      if (sp.drive_folder_id) {
        driveLink.href = `https://drive.google.com/drive/folders/${sp.drive_folder_id}`;
        driveLink.style.display = 'flex';
        driveTag.style.display = 'block';
      } else {
        driveLink.style.display = 'none';
        driveTag.style.display = 'none';
      }

      const isolateBtn = document.getElementById('btnIsolateFamily');
      if (sp.taxonomy.family) {
        isolateBtn.innerText = `Isoler la famille ${sp.taxonomy.family}`;
        isolateBtn.style.display = 'block';
        isolateBtn.onclick = () => {
          setFilter('family', sp.taxonomy.family);
          switchView('grid');
          closeExpertPanel();
        };
      } else {
        isolateBtn.style.display = 'none';
      }

      const ladder = document.getElementById('detailLadder');
      ladder.innerHTML = '';
      const ranks = [
        ['Règne', 'kingdom'],
        ['Embranchement', 'phylum'],
        ['Classe', 'class'],
        ['Ordre', 'order'],
        ['Famille', 'family'],
        ['Sous-famille', 'subfamily'],
        ['Genre', 'genus']
      ];

      ranks.forEach(([label, key]) => {
        if (sp.taxonomy[key]) {
          const row = document.createElement('div');
          row.className = 'ladder-row';
          row.innerHTML = `<span class="ladder-rank">${label}</span><span class="ladder-name">${sp.taxonomy[key]}</span>`;
          ladder.appendChild(row);
        }
      });

      document.getElementById('detailLocText').innerText = 
        `${sp.place || 'Lieu-dit non renseigné'} • Date : ${sp.last_observed || 'Non daté'}`;

      setTimeout(() => {
        if (!detailMap) {
          detailMap = L.map('specimenMap');
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
          }).addTo(detailMap);
        }
        if (sp.coordinates && sp.coordinates.lat && sp.coordinates.lng) {
          const coords = [sp.coordinates.lat, sp.coordinates.lng];
          detailMap.setView(coords, 11);
          if (detailMarker) detailMap.removeLayer(detailMarker);
          detailMarker = L.marker(coords).addTo(detailMap);
          document.getElementById('specimenMap').style.display = 'block';
        } else {
          document.getElementById('specimenMap').style.display = 'none';
        }
        detailMap.invalidateSize();
      }, 200);
    }

    function closeExpertPanel() {
      document.getElementById('expertPanel').classList.remove('open');
    }

    document.getElementById('globalSearch').addEventListener('input', (e) => {
      currentFilter.query = e.target.value.trim();
      applyFilter();
    });

    document.getElementById('resetFilterBtn').addEventListener('click', () => {
      currentFilter = { query: '', rank: null, value: null, driveOnly: false };
      document.getElementById('globalSearch').value = '';
      document.querySelectorAll('.quick-tag').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tree-label').forEach(l => l.classList.remove('selected'));
      applyFilter();
    });

    document.getElementById('onlyDriveBtn').addEventListener('click', () => {
      currentFilter.driveOnly = !currentFilter.driveOnly;
      applyFilter();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (page > 1) { page--; renderGrid(); }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (page * PAGE_SIZE < filteredList.length) { page++; renderGrid(); }
    });
  </script>
</body>
</html>
