<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratoire Cladistique & Taxonomie</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg-space: #07090e;
      --panel-bg: rgba(13, 17, 24, 0.94);
      --card-bg: #111822;
      --card-hover: #172231;
      --border: #1f2937;
      --border-focus: #38bdf8;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-space);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Barre supérieure de télémesure */
    header {
      background: #0b0f17;
      border-bottom: 1px solid var(--border);
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
    }

    .brand-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent-cyan);
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .metrics-bar {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .metric-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    .metric-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    /* Layout Cockpit 3 zones */
    .cockpit-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Volet gauche : Phylogénie & Filtres */
    aside.sidebar-left {
      width: 320px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
    }

    .sidebar-header {
      padding: 0.85rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .search-box input {
      width: 100%;
      background: #090d14;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.45rem 0.65rem;
      color: var(--text-main);
      font-size: 0.825rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus { border-color: var(--border-focus); }

    .taxo-tree {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 0.5rem;
      font-size: 0.8rem;
    }

    .tree-node {
      margin-bottom: 0.25rem;
    }

    .tree-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
      transition: background 0.15s, color 0.15s;
    }

    .tree-label:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    .tree-label.active {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .tree-count {
      font-size: 0.7rem;
      background: #0a0e17;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      color: var(--text-dim);
    }

    .tree-children {
      margin-left: 0.85rem;
      border-left: 1px dashed var(--border);
      padding-left: 0.4rem;
      display: none;
    }

    .tree-children.expanded { display: block; }

    /* Zone centrale : Vue mosaïque */
    main.viewport-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #080b11;
    }

    .subbar {
      height: 42px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      font-size: 0.8rem;
      background: #0b1018;
    }

    .grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      grid-auto-rows: 240px;
      gap: 1rem;
    }

    .specimen-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }

    .specimen-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-cyan);
      background: var(--card-hover);
    }

    .card-thumb {
      flex: 1;
      background: #05070a;
      overflow: hidden;
      position: relative;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .drive-indicator {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(16, 185, 129, 0.85);
      color: #032214;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      backdrop-filter: blur(4px);
    }

    .card-info {
      padding: 0.6rem;
      background: #0e141e;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .card-sci {
      font-size: 0.8rem;
      font-weight: 600;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .card-vern {
      font-size: 0.725rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Volet droit : Fiche d'expertise naturaliste */
    aside.sidebar-right {
      width: 420px;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      z-index: 30;
      backdrop-filter: blur(16px);
      box-shadow: -8px 0 24px rgba(0,0,0,0.6);
    }

    aside.sidebar-right.open {
      transform: translateX(0);
    }

    .right-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover { color: #fff; }

    .right-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .hero-view {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: #000;
      border: 1px solid var(--border);
    }

    .hero-view img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .taxonomy-ladder {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      background: #090d15;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .ladder-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      padding: 0.15rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .ladder-rank { color: var(--text-dim); text-transform: uppercase; font-size: 0.65rem; }
    .ladder-name { font-weight: 500; color: var(--accent-cyan); }

    .actions-panel {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .btn-action {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 0.85rem;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-action:hover {
      background: #283548;
      border-color: var(--accent-cyan);
    }

    .btn-action.primary {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--accent-green);
    }

    .btn-action.primary:hover {
      background: rgba(16, 185, 129, 0.25);
    }

    #specimenMap {
      height: 190px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Télémesure haute -->
  <header>
    <div class="brand">
      <div class="brand-title">Taxa Laboratory</div>
      <div class="brand-badge">Cladistique v2.0</div>
    </div>
    <div class="metrics-bar">
      <div class="metric-item">
        <span class="metric-label">Espèces validées</span>
        <span class="metric-value" id="topSpeciesCount">—</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Dossiers Drive</span>
        <span class="metric-value" id="topDriveCount" style="color: var(--accent-green);">—</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Échantillons affichés</span>
        <span class="metric-value" id="topFilteredCount" style="color: var(--accent-amber);">—</span>
      </div>
    </div>
  </header>

  <div class="cockpit-body">

    <!-- Volet gauche : Exploration taxonomique -->
    <aside class="sidebar-left">
      <div class="sidebar-header">
        <div class="search-box">
          <input type="text" id="globalSearch" placeholder="Binôme latin, famille, nom commun..." />
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button id="resetFilterBtn" class="btn-action" style="flex: 1; padding: 0.35rem 0.5rem; font-size: 0.75rem;">Réinitialiser</button>
          <button id="onlyDriveBtn" class="btn-action primary" style="flex: 1; padding: 0.35rem 0.5rem; font-size: 0.75rem;">Photos Drive</button>
        </div>
      </div>
      <div class="taxo-tree" id="taxoTree">
        <!-- Arbre généré dynamiquement -->
      </div>
    </aside>

    <!-- Zone centrale : Matrice des spécimens -->
    <main class="viewport-center">
      <div class="subbar">
        <div id="filterStatus" style="color: var(--text-muted); font-size: 0.75rem;">Collection complète</div>
        <div style="display: flex; gap: 0.75rem; align-items: center;">
          <span id="pageInfo" style="color: var(--text-dim); font-size: 0.75rem;"></span>
          <button id="prevBtn" class="btn-action" style="padding: 0.25rem 0.6rem;">&lt;</button>
          <button id="nextBtn" class="btn-action" style="padding: 0.25rem 0.6rem;">&gt;</button>
        </div>
      </div>
      <div class="grid-container" id="matrixGrid"></div>
    </main>

    <!-- Volet droit : Expertise naturaliste détaillée -->
    <aside class="sidebar-right" id="expertPanel">
      <div class="right-header">
        <div>
          <h2 id="detailSciName" style="font-style: italic; font-size: 1.15rem; color: #fff;"></h2>
          <p id="detailVernName" style="font-size: 0.8rem; color: var(--text-muted);"></p>
        </div>
        <button class="close-btn" onclick="closeExpertPanel()">&times;</button>
      </div>

      <div class="right-content">
        <div class="hero-view">
          <img id="detailImg" src="" alt="Spécimen" />
          <span id="detailDriveTag" class="drive-indicator" style="display: none;">Dossier Drive lié</span>
        </div>

        <div class="actions-panel">
          <a id="detailDriveLink" href="#" target="_blank" class="btn-action primary" style="display: none;">
            Ouvrir l'archive Google Drive
          </a>
          <button id="btnIsolateFamily" class="btn-action">
            Isoler tous les membres de cette famille
          </button>
        </div>

        <div class="taxonomy-ladder" id="detailLadder"></div>

        <div>
          <div style="font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.4rem; letter-spacing: 0.05em;">
            Coordonnées du relevé de terrain
          </div>
          <div id="specimenMap"></div>
          <div id="detailLocText" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem;"></div>
        </div>
      </div>
    </aside>

  </div>

  <script>
    let rawSpecies = [];
    let currentFilter = { query: '', rank: null, value: null, driveOnly: false };
    let filteredList = [];
    let page = 1;
    const PAGE_SIZE = 60;
    let detailMap = null;
    let detailMarker = null;

    // 1. Initialisation
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        rawSpecies = data;
        filteredList = data;
        document.getElementById('topSpeciesCount').innerText = rawSpecies.length.toLocaleString('fr-FR');
        const driveCount = rawSpecies.filter(s => s.drive_folder_id).length;
        document.getElementById('topDriveCount').innerText = `${driveCount.toLocaleString('fr-FR')} (${Math.round(driveCount / rawSpecies.length * 100)}%)`;

        buildTaxonomyTree();
        applyFilter();
      })
      .catch(err => {
        console.error(err);
        document.getElementById('filterStatus').innerText = 'Erreur de lecture de data.json';
      });

    // 2. Construction de l'arbre phylogénétique dynamique
    function buildTaxonomyTree() {
      const treeContainer = document.getElementById('taxoTree');
      treeContainer.innerHTML = '';

      // Regroupement hiérarchique : Phylum -> Class -> Order
      const tree = {};
      rawSpecies.forEach(sp => {
        const phylum = sp.taxonomy.phylum || 'Non classé';
        const cls = sp.taxonomy.class || 'Classe indéterminée';
        const ord = sp.taxonomy.order || 'Ordre indéterminé';

        if (!tree[phylum]) tree[phylum] = { count: 0, classes: {} };
        tree[phylum].count++;

        if (!tree[phylum].classes[cls]) tree[phylum].classes[cls] = { count: 0, orders: {} };
        tree[phylum].classes[cls].count++;

        if (!tree[phylum].classes[cls].orders[ord]) tree[phylum].classes[cls].orders[ord] = 0;
        tree[phylum].classes[cls].orders[ord]++;
      });

      // Rendu HTML récursif
      Object.keys(tree).sort().forEach(phylum => {
        const phylumNode = createNode(phylum, 'phylum', tree[phylum].count);
        const pChildren = document.createElement('div');
        pChildren.className = 'tree-children';

        Object.keys(tree[phylum].classes).sort().forEach(cls => {
          const clsNode = createNode(cls, 'class', tree[phylum].classes[cls].count);
          const cChildren = document.createElement('div');
          cChildren.className = 'tree-children';

          Object.keys(tree[phylum].classes[cls].orders).sort().forEach(ord => {
            const ordNode = createNode(ord, 'order', tree[phylum].classes[cls].orders[ord]);
            cChildren.appendChild(ordNode);
          });

          clsNode.appendChild(cChildren);
          pChildren.appendChild(clsNode);
        });

        phylumNode.appendChild(pChildren);
        treeContainer.appendChild(phylumNode);
      });
    }

    function createNode(title, rank, count) {
      const div = document.createElement('div');
      div.className = 'tree-node';

      const label = document.createElement('div');
      label.className = 'tree-label';
      label.innerHTML = `<span>${title}</span> <span class="tree-count">${count}</span>`;

      label.onclick = (e) => {
        e.stopPropagation();
        // Déplier/Replier
        const children = div.querySelector('.tree-children');
        if (children) children.classList.toggle('expanded');

        // Filtrer
        setFilter(rank, title);
      };

      div.appendChild(label);
      return div;
    }

    // 3. Filtrage dynamique
    function setFilter(rank, value) {
      currentFilter.rank = rank;
      currentFilter.value = value;
      applyFilter();
    }

    function applyFilter() {
      filteredList = rawSpecies.filter(sp => {
        // Recherche texte
        if (currentFilter.query) {
          const q = currentFilter.query.toLowerCase();
          const matchSci = sp.scientific_name.toLowerCase().includes(q);
          const matchVern = sp.common_name && sp.common_name.toLowerCase().includes(q);
          const matchFam = sp.taxonomy.family && sp.taxonomy.family.toLowerCase().includes(q);
          if (!matchSci && !matchVern && !matchFam) return false;
        }

        // Filtre de rang taxonomique
        if (currentFilter.rank && currentFilter.value) {
          if (sp.taxonomy[currentFilter.rank] !== currentFilter.value) return false;
        }

        // Filtre Drive uniquement
        if (currentFilter.driveOnly && !sp.drive_folder_id) return false;

        return true;
      });

      page = 1;
      renderGrid();
      updateSubbar();
    }

    function updateSubbar() {
      document.getElementById('topFilteredCount').innerText = filteredList.length.toLocaleString('fr-FR');
      const label = currentFilter.value ? `${currentFilter.rank.toUpperCase()} : ${currentFilter.value}` : 'Collection complète';
      document.getElementById('filterStatus').innerText = `${label} (${filteredList.length} espèces)`;
    }

    // 4. Rendu de la grille virtuelle
    function renderGrid() {
      const container = document.getElementById('matrixGrid');
      container.innerHTML = '';

      const start = (page - 1) * PAGE_SIZE;
      const slice = filteredList.slice(start, start + PAGE_SIZE);

      slice.forEach(sp => {
        const card = document.createElement('div');
        card.className = 'specimen-card';
        card.onclick = () => openExpertPanel(sp);

        const thumb = sp.photo_url || 'https://via.placeholder.com/300x220/090d14/475569?text=Absence+de+cliché';
        const driveBadge = sp.drive_folder_id ? `<span class="drive-indicator">DRIVE</span>` : '';

        card.innerHTML = `
          <div class="card-thumb">
            <img src="${thumb}" alt="${sp.scientific_name}" loading="lazy">
            ${driveBadge}
          </div>
          <div class="card-info">
            <div class="card-sci">${sp.scientific_name}</div>
            <div class="card-vern">${sp.common_name || sp.taxonomy.family || 'Taxon valide'}</div>
          </div>
        `;
        container.appendChild(card);
      });

      const totalPages = Math.max(1, Math.ceil(filteredList.length / PAGE_SIZE));
      document.getElementById('pageInfo').innerText = `Page ${page} / ${totalPages}`;
      container.scrollTop = 0;
    }

    // 5. Volet droit d'expertise naturaliste
    function openExpertPanel(sp) {
      const panel = document.getElementById('expertPanel');
      panel.classList.add('open');

      document.getElementById('detailSciName').innerText = sp.scientific_name;
      document.getElementById('detailVernName').innerText = sp.common_name || 'Nom commun non renseigné';
      document.getElementById('detailImg').src = sp.photo_url || '';

      // Bouton & tag Drive
      const driveLink = document.getElementById('detailDriveLink');
      const driveTag = document.getElementById('detailDriveTag');
      if (sp.drive_folder_id) {
        driveLink.href = `https://drive.google.com/drive/folders/${sp.drive_folder_id}`;
        driveLink.style.display = 'flex';
        driveTag.style.display = 'block';
      } else {
        driveLink.style.display = 'none';
        driveTag.style.display = 'none';
      }

      // Bouton isoler la famille
      const isolateBtn = document.getElementById('btnIsolateFamily');
      if (sp.taxonomy.family) {
        isolateBtn.innerText = `Isoler la famille ${sp.taxonomy.family}`;
        isolateBtn.style.display = 'block';
        isolateBtn.onclick = () => {
          setFilter('family', sp.taxonomy.family);
          closeExpertPanel();
        };
      } else {
        isolateBtn.style.display = 'none';
      }

      // Échelle taxonomique
      const ladder = document.getElementById('detailLadder');
      ladder.innerHTML = '';
      const ranks = [
        ['Règne', 'kingdom'],
        ['Embranchement', 'phylum'],
        ['Classe', 'class'],
        ['Ordre', 'order'],
        ['Famille', 'family'],
        ['Sous-famille', 'subfamily'],
        ['Genre', 'genus']
      ];

      ranks.forEach(([label, key]) => {
        if (sp.taxonomy[key]) {
          const row = document.createElement('div');
          row.className = 'ladder-row';
          row.innerHTML = `<span class="ladder-rank">${label}</span><span class="ladder-name">${sp.taxonomy[key]}</span>`;
          ladder.appendChild(row);
        }
      });

      // Cartographie satellite ESRI / Leaflet
      document.getElementById('detailLocText').innerText = 
        `${sp.place || 'Lieu-dit non renseigné'} • Date : ${sp.last_observed || 'Non daté'}`;

      setTimeout(() => {
        if (!detailMap) {
          detailMap = L.map('specimenMap');
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
          }).addTo(detailMap);
        }
        if (sp.coordinates && sp.coordinates.lat && sp.coordinates.lng) {
          const coords = [sp.coordinates.lat, sp.coordinates.lng];
          detailMap.setView(coords, 11);
          if (detailMarker) detailMap.removeLayer(detailMarker);
          detailMarker = L.marker(coords).addTo(detailMap);
          document.getElementById('specimenMap').style.display = 'block';
        } else {
          document.getElementById('specimenMap').style.display = 'none';
        }
        detailMap.invalidateSize();
      }, 200);
    }

    function closeExpertPanel() {
      document.getElementById('expertPanel').classList.remove('open');
    }

    // Événements d'interface
    document.getElementById('globalSearch').addEventListener('input', (e) => {
      currentFilter.query = e.target.value.trim();
      applyFilter();
    });

    document.getElementById('resetFilterBtn').addEventListener('click', () => {
      currentFilter = { query: '', rank: null, value: null, driveOnly: false };
      document.getElementById('globalSearch').value = '';
      applyFilter();
    });

    document.getElementById('onlyDriveBtn').addEventListener('click', () => {
      currentFilter.driveOnly = !currentFilter.driveOnly;
      applyFilter();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (page > 1) { page--; renderGrid(); }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (page * PAGE_SIZE < filteredList.length) { page++; renderGrid(); }
    });
  </script>
</body>
</html>
